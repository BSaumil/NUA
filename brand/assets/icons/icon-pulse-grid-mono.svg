<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NUA">
  <title>NUA Pulse Grid (mono)</title>
  <!-- Single-tone variant for favicons and any use below ~24px, where the
       full-colour tiles muddy into noise. Inherits currentColor so it can be
       tinted by context; opacity carries the pulse rhythm instead of hue. -->
  <g fill="currentColor">
    <rect x="4"  y="44" width="16" height="16" rx="4.5" opacity="0.45"/>
    <rect x="24" y="24" width="16" height="16" rx="4.5" opacity="0.7"/>
    <rect x="24" y="44" width="16" height="16" rx="4.5" opacity="0.9"/>
    <rect x="44" y="4"  width="16" height="16" rx="4.5"/>
    <rect x="44" y="24" width="16" height="16" rx="4.5"/>
    <rect x="44" y="44" width="16" height="16" rx="4.5"/>
  </g>
</svg>
