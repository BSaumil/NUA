<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100" role="img" aria-label="NUA">
  <title>NUA horizontal lockup</title>
  <!-- Icon + gradient wordmark + flourish. Clear space: one grid-tile width
       (16 units at the icon's native 64 scale) on all sides, minimum.
       References Instrument Serif by name — see wordmark-nua-gradient.svg. -->
  <defs>
    <linearGradient id="lockTileWarm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#f58c14"/><stop offset="100%" stop-color="#f9a03f"/>
    </linearGradient>
    <linearGradient id="lockWordGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f58c14"/><stop offset="50%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g transform="translate(16,18)">
    <rect x="4"  y="44" width="16" height="16" rx="4.5" fill="url(#lockTileWarm)" opacity="0.55"/>
    <rect x="24" y="24" width="16" height="16" rx="4.5" fill="url(#lockTileWarm)" opacity="0.8"/>
    <rect x="24" y="44" width="16" height="16" rx="4.5" fill="url(#lockTileWarm)"/>
    <rect x="44" y="4"  width="16" height="16" rx="4.5" fill="#8b5cf6"/>
    <rect x="44" y="24" width="16" height="16" rx="4.5" fill="#ec4899"/>
    <rect x="44" y="44" width="16" height="16" rx="4.5" fill="url(#lockTileWarm)"/>
  </g>
  <text x="108" y="62" font-family="'Instrument Serif', Georgia, serif" font-style="italic"
        font-size="58" fill="url(#lockWordGradient)">Nua</text>
  <path d="M112 76 C 140 66, 178 66, 214 72 S 258 78, 286 68"
        fill="none" stroke="#f58c14" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
</svg>
