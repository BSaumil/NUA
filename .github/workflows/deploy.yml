name: Deploy to Fly.io

# Triggers:
#   - Every push to `main` (or `master`) auto-deploys
#   - Manual run via the GitHub UI ("Run workflow" button)
on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which service to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  # Cancel an in-flight deploy if a new commit lands on the same branch.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # finish current deploy before starting next (safer than cancelling mid-build)

jobs:
  # ─── Smart change detection ─────────────────────────────────────────
  # Only re-deploy the service whose code actually changed. On manual
  # runs, honour the `target` input instead.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            t="${{ inputs.target }}"
            echo "backend=$([[ $t == both || $t == backend ]] && echo true || echo false)"  >> $GITHUB_OUTPUT
            echo "frontend=$([[ $t == both || $t == frontend ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.changes.outputs.backend }}"   >> $GITHUB_OUTPUT
            echo "frontend=${{ steps.changes.outputs.frontend }}" >> $GITHUB_OUTPUT
          fi

  # ─── Backend deploy ─────────────────────────────────────────────────
  deploy-backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://nua-backend.fly.dev/api/social/platforms || true)
          echo "Backend HTTP status: $code"
          [[ "$code" == "401" || "$code" == "200" ]] || { echo "❌ unexpected status"; exit 1; }
          echo "✅ Backend reachable"

  # ─── Frontend deploy ────────────────────────────────────────────────
  deploy-frontend:
    needs: [detect, deploy-backend]
    # Run even if backend was skipped (frontend-only change should still ship)
    if: |
      always() &&
      needs.detect.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy frontend
        working-directory: ./frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://nua-frontend.fly.dev/ || true)
          echo "Frontend HTTP status: $code"
          [[ "$code" == "200" ]] || { echo "❌ unexpected status"; exit 1; }
          echo "✅ Frontend reachable"

  # ─── Notify (Slack/Discord optional — leave webhook secret unset to skip) ─
  notify:
    needs: [deploy-backend, deploy-frontend]
    if: always() && (needs.deploy-backend.result != 'skipped' || needs.deploy-frontend.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "### Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service  | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | ${{ needs.deploy-backend.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Live: https://nua-frontend.fly.dev" >> $GITHUB_STEP_SUMMARY
