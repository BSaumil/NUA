name: CI

# Runs on every PR and every push, on every branch — unlike deploy.yml, which
# only fires on main/master. This is what a reviewer sees turn red *before*
# something merges, rather than after it's live on Fly.io.
on:
  pull_request:
  push:
    branches-ignore: [main, master]   # main/master go through deploy.yml's own test job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: the in-process suite ──────────────────────────────────────
  # backend/tests/*.py (the 50+ files outside tests/inprocess/) all talk to a
  # live BASE_URL and were never runnable here. backend/tests/inprocess mounts
  # the real app through TestClient with an in-memory Mongo, so it needs
  # nothing but Python — no service containers, no boot step.
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run in-process test suite
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ci_tests
          JWT_SECRET: ci-test-secret-not-for-production
        run: python -m pytest tests/inprocess -v

  # ─── Frontend: build must succeed ───────────────────────────────────────
  # There's no test runner wired up on the frontend yet (see the enhancement
  # list) — a clean production build is the floor, and it's still worth
  # blocking on: it catches the raw-fetch-with-no-auth-header class of bug
  # that a passing backend suite alone wouldn't (import errors, JSX errors,
  # broken imports of things like the twoFactorAPI export).
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx craco build
        env:
          CI: false   # CRA treats warnings as errors under CI=true; this repo isn't warning-clean yet
